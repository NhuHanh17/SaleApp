{%extends 'layout/base.html' %}


{%block content%}
<section class="container">
    {% if page > 1: %}
      
        <ul class="pagination pt-2">

          {% for i in range(1, page+1) %}
             <li class="page-item"><a class="page-link" href="/?page={{ i }}">{{ i }}</a></li>
          {% endfor %} 
        </ul>
      
    {%endif%}


    {%if products %}
    <div class="row">  
    {% for p in products%}
    <div class="col-md-3 col-4 p-3">
      <div class="card mb-3">
        <img src="{{ p.image }}" class="card-img-top" alt="{{ p.name }}">
        <div class="card-body">
          <h5 class="card-title">{{ p.name }}</h5>
          <p class="card-text">{{ p.price}} VNĐ</p>
           <a href="#" class="btn btn-primary">Xem chi tiết</a>
          <button class="btn btn-danger" onclick=" addToCart({{p.id}}, '{{p.name}}', {{p.price}})">Mua</button>
          </div>
        </div> 
      </div>
    {%endfor%}
    </div>

  {%else%}

    <div class="alert alert-warning text-center m-3" >Không có sản phẩm nào!!!</div>

  {%endif%}

</section>
{%endblock%}
